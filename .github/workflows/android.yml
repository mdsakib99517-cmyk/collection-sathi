name: Build Collection Sathi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            echo "Please upload the Android project ZIP to this repository."
            exit 1
          fi

          echo "Found project: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project files:"
          find project -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: collection-sathi-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
